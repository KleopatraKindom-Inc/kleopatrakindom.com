<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация KleopatraKindomOS</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: rgba(26, 26, 30, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-color: #a855f7;
            --accent-hover: #c084fc;
            --header-bg: rgba(15, 15, 17, 0.8);
            --code-bg: #141418;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .brand:hover { transform: scale(1.03); }

        .brand img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .brand:hover img { transform: rotate(10deg) scale(1.1); }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
        }

        .custom-select-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .custom-select-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        }

        .custom-select-btn .arrow {
            font-size: 0.7rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-select-wrapper.open .custom-select-btn .arrow {
            transform: rotate(180deg);
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(168, 85, 247, 0.15);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px) scale(0.95);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 90px;
            z-index: 200;
        }

        .custom-select-wrapper.open .custom-select-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .option-item {
            padding: 8px 16px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .option-item:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #fff;
        }

        .option-item.selected {
            color: var(--accent-color);
            font-weight: bold;
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 2.5rem 1.5rem;
            flex: 1;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .content-card:hover {
            border-color: rgba(168, 85, 247, 0.25);
            box-shadow: 0 25px 50px rgba(168, 85, 247, 0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page-content h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #a855f7 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: gradientShift 6s ease infinite alternate;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .page-content h2 { font-size: 1.5rem; margin-top: 1.8rem; margin-bottom: 0.8rem; color: #f1f5f9; }
        .page-content h3 { font-size: 1.2rem; margin-top: 1.5rem; margin-bottom: 0.6rem; color: #e2e8f0; }
        .page-content h4 { font-size: 1rem; margin-top: 1.2rem; margin-bottom: 0.5rem; color: #cbd5e1; }
        .page-content p { margin-bottom: 1rem; color: #cbd5e1; }
        .page-content hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--border-color), transparent); margin: 2rem 0; }

        .key-box {
            background: var(--code-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin: 1.5rem 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.05);
            transition: all 0.3s ease;
        }

        .key-box:hover {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.15), inset 0 0 20px rgba(168, 85, 247, 0.1);
        }

        .key-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
        }

        .key-code {
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            user-select: all;
            word-break: break-all;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: #fff;
            font-weight: 600;
            padding: 0.8rem 1.6rem;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
        }

        footer {
            width: 100%;
            max-width: 900px;
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            header, main, footer { padding-left: 1rem; padding-right: 1rem; }
            .content-card { padding: 1.5rem; }
            .page-content h1 { font-size: 1.75rem; }
            .key-code { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <img src="./favicon.png" alt="KleopatraKindom Icon" onerror="this.style.display='none'">
            <span>KleopatraKindom</span>
        </a>
        
        <div class="custom-select-wrapper" id="langDropdown">
            <div class="custom-select-btn" id="langBtn">
                <span id="currentLang">RU</span>
                <span class="arrow">▼</span>
            </div>
            <div class="custom-select-dropdown">
                <div class="option-item" data-value="RU">RU</div>
                <div class="option-item" data-value="EN">EN</div>
                <div class="option-item" data-value="UK">UK</div>
            </div>
        </div>
    </header>

    <main>
        <div class="content-card">
            <article class="page-content" id="content">
                <h1 id="title">Спасибо за скачивание KleopatraKindomOS!</h1>
                
                <h2 id="after-install-title">После установки</h2>
                <p id="after-install-desc">Вам нужно будет в первоначальной настройке (oobe) ввести ключ продукта!</p>
                
                <div class="key-box">
                    <span class="key-title" id="key-title-label">Ключ активации продукта:</span>
                    <div class="key-code">$KOS:47591479754</div>
                </div>

                <hr>

                <div>
                    <a href="https://" class="btn-download" id="download-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="download-text">Скачать ISO</span>
                    </a>
                </div>
            </article>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 KleopatraKindom</p>
    </footer>

    <script>
        const i18n = {
            RU: {
                title: "Спасибо за скачивание KleopatraKindomOS!",
                afterInstallTitle: "После установки",
                afterInstallDesc: "Вам нужно будет в первоначальной настройке (oobe) ввести ключ продукта!",
                keyTitle: "Ключ активации продукта:",
                downloadBtn: "Скачать ISO"
            },
            EN: {
                title: "Thank you for downloading KleopatraKindomOS!",
                afterInstallTitle: "After installation",
                afterInstallDesc: "You will need to enter the product key during initial setup (OOBE)!",
                keyTitle: "Product activation key:",
                downloadBtn: "Download ISO"
            },
            UK: {
                title: "Дякуємо за завантаження KleopatraKindomOS!",
                afterInstallTitle: "Після встановлення",
                afterInstallDesc: "Вам потрібно буде в початковому налаштуванні (OOBE) ввести ключ продукту!",
                keyTitle: "Ключ активації продукту:",
                downloadBtn: "Завантажити ISO"
            }
        };

        function setLanguage(lang) {
            const data = i18n[lang] || i18n['RU'];
            document.getElementById('title').textContent = data.title;
            document.getElementById('after-install-title').textContent = data.afterInstallTitle;
            document.getElementById('after-install-desc').textContent = data.afterInstallDesc;
            document.getElementById('key-title-label').textContent = data.keyTitle;
            document.getElementById('download-text').textContent = data.downloadBtn;

            localStorage.setItem('selected_lang', lang);
            document.getElementById('currentLang').textContent = lang;
            
            document.querySelectorAll('.option-item').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.value === lang);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dropdown = document.getElementById('langDropdown');
            const btn = document.getElementById('langBtn');
            const savedLang = localStorage.getItem('selected_lang') || 'RU';

            setLanguage(savedLang);

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });

            document.querySelectorAll('.option-item').forEach(item => {
                item.addEventListener('click', () => {
                    const selectedLang = item.dataset.value;
                    setLanguage(selectedLang);
                    dropdown.classList.remove('open');
                });
            });

            document.addEventListener('click', () => {
                dropdown.classList.remove('open');
            });
        });
    </script>
</body>
</html>
